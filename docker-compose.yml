services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fruitshop-app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    environment:
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: fruitshop
      DB_USERNAME: fruitshop
      DB_PASSWORD: fruitshop
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_ENCRYPTION: ""
      MAIL_FROM_ADDRESS: thegioitraicay@example.test
      MAIL_FROM_NAME: The Gioi Trai Cay
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a strong ADMIN_PASSWORD in .env}
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - fruitshop

  mysql:
    image: mysql:8.0
    container_name: fruitshop-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: fruitshop
      MYSQL_USER: fruitshop
      MYSQL_PASSWORD: fruitshop
      MYSQL_ROOT_PASSWORD: root
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - fruitshop

  phpmyadmin:
    image: phpmyadmin:5
    container_name: fruitshop-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - fruitshop

  mailpit:
    image: axllent/mailpit:latest
    container_name: fruitshop-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - fruitshop

  node:
    image: node:22-alpine
    container_name: fruitshop-node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: sh -lc "npm install && npm run dev"
    profiles:
      - assets
    networks:
      - fruitshop

networks:
  fruitshop:
    driver: bridge

volumes:
  mysql_data:
