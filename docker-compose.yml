services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fruitshop-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./:/var/www/html
      - app_vendor:/var/www/html/vendor
      - app_framework:/var/www/html/storage/framework
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
    environment:
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: fruitshop
      DB_USERNAME: fruitshop
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-fruitshop}
      GOOGLE_REDIRECT_URI: http://localhost:8080/auth/google/callback
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - fruitshop

  mysql:
    image: mysql:8.0
    container_name: fruitshop-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: fruitshop
      MYSQL_USER: fruitshop
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-fruitshop}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-root}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - fruitshop

  mysql_test:
    image: mysql:8.0
    container_name: fruitshop-mysql-test
    profiles: ["test"]
    ports:
      - "127.0.0.1:3308:3306"
    environment:
      MYSQL_DATABASE: fruitshop_test
      MYSQL_USER: fruitshop
      MYSQL_PASSWORD: fruitshop_test
      MYSQL_ROOT_PASSWORD: fruitshop_test_root
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - fruitshop

  phpmyadmin:
    image: phpmyadmin:5
    container_name: fruitshop-phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-root}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - fruitshop

  node:
    image: node:22-alpine
    container_name: fruitshop-node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: sh -lc "npm ci && npm run dev"
    profiles:
      - assets
    networks:
      - fruitshop

networks:
  fruitshop:
    driver: bridge

volumes:
  mysql_data:
  app_vendor:
  app_framework:
  app_bootstrap_cache:
