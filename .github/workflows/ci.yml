name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: fruitshop_test
          MYSQL_USER: fruitshop
          MYSQL_PASSWORD: fruitshop_test
          MYSQL_ROOT_PASSWORD: fruitshop_test_root
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pfruitshop_test_root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, gd, intl, mbstring, pdo_mysql, zip
          coverage: none

      - name: Validate Composer files
        run: composer validate --strict --no-interaction

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate

      - name: Build frontend assets
        run: npm run build

      - name: Run PHP tests against isolated MySQL
        run: php scripts/run-php-tests.php
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3308
          TEST_DB_DATABASE: fruitshop_test
          TEST_DB_USERNAME: fruitshop
          TEST_DB_PASSWORD: fruitshop_test
